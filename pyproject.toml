[project]
name = "boss-differential-security-auditor"
version = "0.2.0"
description = "Read-only differential security auditing framework comparing a Debian 13 baseline against a modified target system (e.g. BOSS OS) for CTF / bug-bounty style manual investigation."
requires-python = ">=3.12"
authors = [{ name = "Security Research Team" }]
readme = "README.md"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "mypy>=1.9.0"]

[project.scripts]
boss-auditor = "boss_auditor.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/boss_auditor/tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
mypy_path = ["src"]
